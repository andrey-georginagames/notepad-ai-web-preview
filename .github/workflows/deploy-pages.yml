name: Notepad AI Agent - GitHub Pages Preview

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: notepad-ai-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout standalone preview repository
        uses: actions/checkout@v4
      - name: Verify unmodified Concept 02 v0.3.0 HTML
        run: echo '95a13d74e384526a1899230775789f882b5f1ad8c24efe33391b992cba0808f4  index.html' | sha256sum -c -
      - name: Stage only the standalone Notepad website
        run: |
          mkdir -p site
          cp index.html site/index.html
          touch site/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload standalone website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
