/* Concept 02 v0.5.0 — lightweight mobile notes UX */
.note-list-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0 6px}
.note-tool{display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:7px 11px;background:var(--soft);border:1px solid var(--line);border-radius:11px;font-size:12px;color:var(--text)}
.note-tool[aria-pressed="true"]{background:var(--tint);color:var(--accent);border-color:var(--accent)}
.note-list-tools .note-tool svg{width:15px;height:15px}
.note-row{display:flex;align-items:center;gap:11px;min-height:72px;text-align:left;width:100%;padding:10px 0;border-bottom:1px solid var(--line)}
.note-row .rowicon{width:24px;flex:none;justify-content:center}
.note-row .rowicon svg{width:19px;height:19px}
.note-row-main{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px}
.note-row-title{font-size:15px;font-weight:600;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
.note-row-title .cat-dot{margin-right:7px;transform:translateY(-1px)}
.note-row-preview{font-size:12px;color:var(--muted);white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
.note-row-meta{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:8px;white-space:nowrap;min-width:0}
.note-row-meta .tagname{min-width:0;overflow:hidden;text-overflow:ellipsis}
.note-row .small-icon{flex:none;color:var(--muted)}
.notes-compact .note-row{min-height:52px;padding:6px 0;gap:8px}
.notes-compact .note-row-title{font-size:14px}
.notes-compact .note-row-preview{font-size:11px}
.notes-compact .note-row-meta{display:none}
.notes-compact .rowicon{width:19px}
.cat-dot{display:inline-block;vertical-align:middle;flex:none;width:8px;height:8px;border-radius:50%;background:var(--cat-0)}
.cat-0{--cat-0:#5b9f81}.cat-1{--cat-0:#868bd0}.cat-2{--cat-0:#cb9852}.cat-3{--cat-0:#b47b96}.cat-4{--cat-0:#549eae}.cat-5{--cat-0:#96974d}.cat-6{--cat-0:#9a85b4}
.editor-cat{display:inline-flex;align-items:center;gap:7px}
.notes-compact .note-row-preview{max-height:18px}
.checklist-actions{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin:14px 0 2px}
.checklist-actions button{min-height:44px;font-size:12px;padding:7px 12px;border:1px solid var(--line);border-radius:10px;color:var(--accent);background:var(--soft)}
.checkline button.check{min-width:40px;min-height:40px;margin-top:0;display:flex;align-items:center;justify-content:center;flex:none}
.checkline span{min-width:0;flex:1;overflow-wrap:anywhere}
.checkline.complete{opacity:.78}
.checklist-reorder{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.checklist-reorder .grow{font-size:13px;overflow-wrap:anywhere}
.checklist-reorder button{min-height:44px;min-width:44px;display:inline-flex;justify-content:center;align-items:center;border-radius:10px;background:var(--soft);color:var(--text)}
.checklist-reorder button:disabled{opacity:.25}
mark.note-hit{background:#f1d692;color:#352c16;border-radius:2px;padding:0 1px}
[data-theme=dark] mark.note-hit{background:#74642a;color:#fff2ba}
.section-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.section-actions button{min-height:42px}
.content{scroll-padding-bottom:105px;min-height:0}
.editor-title,.note-body{scroll-margin-bottom:155px}
input,textarea{touch-action:manipulation}
@media(max-width:350px){.content{padding-left:16px;padding-right:16px}.note-list-tools{gap:5px}.note-tool{padding:7px 8px}.sectionhead h2{font-size:15px}.section-actions{gap:4px}.section-actions button{font-size:11px}.editor-title{font-size:25px}}
@supports(height:100dvh){.device,.phone,.mockphone{max-height:100dvh}}

/* v0.6 management: independent, keyboard-accessible menu and calm tile/list views */
.note-card{position:relative;display:flex;align-items:stretch;min-width:0;gap:0;border-bottom:1px solid var(--line);border-radius:9px;transition:background .12s}
.note-card:last-child{border-bottom:0}.note-card:hover{background:var(--soft)}
.note-card.is-selected{background:var(--tint);outline:2px solid var(--accent);outline-offset:-2px}
.note-accent{width:4px;flex:none;border-radius:7px;background:var(--note-color);margin:11px 7px 11px 0}.note-accent.neutral{opacity:.65}
.note-open{min-width:0;flex:1;border:0;padding:12px 0!important;min-height:63px;overflow:hidden}
.note-open .rowicon{flex:none}.note-open .note-row-main{min-width:0;flex:1}
.note-open .note-row-title,.note-open .note-row-preview,.note-open .note-row-meta{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note-open .note-row-title{font-size:15px;font-weight:650}
.note-open .note-row-preview{font-size:13px;color:var(--muted);margin-top:3px}
.note-open .note-row-meta{font-size:11px;color:var(--muted);margin-top:3px}
.note-more{width:44px;min-width:44px;border-radius:11px;display:grid;place-items:center;color:var(--muted)}

function highlightText(text,query){const str=String(text??''),q=String(query||'').trim();if(!q)return E(str);let out='',cursor=0,lower=str.toLocaleLowerCase(),find=q.toLocaleLowerCase(),pos;while((pos=lower.indexOf(find,cursor))>=0){out+=E(str.slice(cursor,pos))+'<mark class="note-hit">'+E(str.slice(pos,pos+q.length))+'</mark>';cursor=pos+q.length;if(cursor>=str.length)break;}return out+E(str.slice(cursor));}
function snippetNear(text,query,max=110){const clean=String(text||'').replace(/^\[[ xX]\]\s?/gm,'').replace(/\s+/g,' ').trim();const n=clean.toLocaleLowerCase().indexOf(String(query||'').toLocaleLowerCase());if(n<0||n<32)return clean.slice(0,max);const start=Math.max(0,n-28);return '…'+clean.slice(start,start+max);}

function persist(){try{if(flags.saveError)throw new Error('Demo save error');if(storeBlocked)throw new Error('Stored data needs recovery');localStorage.setItem(KEY,JSON.stringify(data));storageError='';return true}catch(e){storageError=flags.saveError?'Demo: this write was not saved.':storeBlocked?'Stored data needs recovery. Export it from Data & sync before resetting.':'Could not save in this browser. Keep this tab open and export your text.';return false}}
function transaction(fn){const before=JSON.stringify(data);fn();if(persist())return true;data=JSON.parse(before);toast('Not saved. Your previous data is unchanged.');return false}
function applyTheme(){localeChrome();const dark=data.theme==='dark'||(data.theme==='system'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=dark?'dark':'light';document.documentElement.dataset.font=data.font;document.documentElement.style.fontSize=data.font==='large'?'18px':'16px';$('#themeLabel').innerHTML=icon(dark?'moon':'sun')+T(dark?'Dark':'Light');document.querySelector('meta[name="theme-color"]').content=dark?'#151b18':'#fafaf7'}
function toast(text){const el=$('#toast');el.textContent=T(text);el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,2900)}
function saveEditorCursor(){if(route.name!=='editor'||!note(route.id))return;const c=$('.content'),el=$('#noteBody');const before=data.prefs.editorResume||{};data.prefs.editorResume={id:route.id,start:el&&!el.hidden?el.selectionStart:(before.id===route.id?before.start:0)||0,end:el&&!el.hidden?el.selectionEnd:(before.id===route.id?before.end:0)||0,scroll:c?.scrollTop||0};}
function leaveEditor(nextName,nextProps={}){if(route.name==='editor')saveEditorCursor();data.prefs.editorResume=nextName==='editor'&&note(nextProps.id)?{id:nextProps.id,start:0,end:0,scroll:0}:null;persist();}
function nav(name,props={},root=false){if(name!=='notes'){selectMode=false;selection.clear();}if(route.name==='editor'||name==='editor')leaveEditor(name,props);closeSheet();editing=false;if(root)trail=[];else trail.push({...route,scroll:$('.content')?.scrollTop||0});route={name,...props};render();try{history.pushState({notepad:true,route},'')}catch{}}
function back(){if(selectMode){clearSelection();return;}const next=trail.pop()||{name:'home'};if(route.name==='editor'||next.name==='editor')leaveEditor(next.name,next);closeSheet();editing=false;route=next;render();if($('.content'))$('.content').scrollTop=route.scroll||0;try{history.replaceState({notepad:true,route},'')}catch{}}
function header(title,actions='',nested=false){return `<header class="top ${nested?'nested':''}">${nested?ib('back','back','Back'):''}<div class="grow"><h1>${E(title)}</h1></div>${actions}</header>`}
function bottom(active){return `<nav class="nav" aria-label="Main navigation">${[['home','Home'],['notes','Notes'],['ai','AI'],['calendar','Calendar'],['more','More']].map(([k,t])=>`<button data-act="root" data-route="${k}" class="${active===k?'active':''}" ${active===k?'aria-current="page"':''}>${icon(k)}<span>${t}</span></button>`).join('')}</nav>`}
function page(title,body,actions='',root='',foot=''){return header(title,actions,!root)+`<div class="content ${root==='home'||root==='notes'||root==='calendar'?'withfab':''}">${body}</div>`+foot+(root?bottom(root):'')}
function empty(title,desc,k='note',action=''){return `<div class="empty"><div class="emptyicon">${icon(k)}</div><h2>${E(title)}</h2><p>${E(desc)}</p>${action}</div>`}
function row(k,title,desc,act,extra='',end=''){return `<button class="row" ${["note","storedmenu","setcontext","chat","noop"].includes(act)?"data-no-i18n":""} data-act="${act}" ${extra}><span class="rowicon">${icon(k)}</span><span class="grow"><span class="title">${E(title)}</span>${desc?`<span class="desc">${E(desc)}</span>`:''}</span>${end||`<span class="small-icon">${icon('chevron')}</span>`}</button>`}
function section(title,action,content){return `<section class="section"><div class="sectionhead"><h2>${title}</h2>${action}</div>${content}</section>`}
function noteRow(n,query=''){
 const title=n.title||T('Untitled note'),preview=snippetNear(n.body,query),meta=[n.category,n.day?dateLabel(n.day):formatUpdated(n)].filter(Boolean).join(' · ');
 const selected=route.name==='notes'&&selection.has(n.id);
 return `<div class="note-card ${selected?'is-selected':''}" data-noteid="${E(n.id)}" data-color="${safeColor(n)}">${accentStrip(n)}<button class="row note-row note-open" data-act="note" data-id="${E(n.id)}" data-match="${E(query)}" aria-label="${E(title)}" aria-pressed="${route.name==='notes'&&selectMode?selected:false}"><span class="rowicon">${route.name==='notes'&&selectMode?icon(selected?'check':'circle'):icon('note')}</span><span class="note-row-main"><span class="note-row-title" data-no-i18n>${catDot(n.category)}${highlightText(title,query)}</span><span class="note-row-preview" data-no-i18n>${highlightText(preview,query)}</span><span class="note-row-meta"><span class="tagname" data-no-i18n>${E(meta||T('No category'))}</span></span></span>${n.pinned?`<span class="small-icon">${icon('pin')}</span>`:''}</button><button class="note-more" data-act="notemenu" data-id="${E(n.id)}" aria-label="${E(T('Note options'))}" title="${E(T('Note options'))}">${icon('more')}</button></div>`;
}
function taskRow(t){return `<div class="row ${t.done?'done':''}"><button class="check ${t.done?'checked':''}" data-act="checktask" data-id="${E(t.id)}" aria-label="${t.done?'Reopen':'Complete'} ${E(t.title)}">${t.done?icon('check'):''}</button><button class="task-title" data-act="task" data-id="${E(t.id)}"><span class="title" data-no-i18n>${E(t.title)}</span><span class="desc">${E(dateLabel(t.date))}${t.time?', '+E(t.time):''}</span></button><span class="small-icon">${icon('chevron')}</span></div>`}
function dateLabel(d){if(!d)return isRU()?'Без даты':'No date';if(d===today)return T('Today');if(d===tomorrow())return T('Tomorrow');return new Date(d+'T12:00:00').toLocaleDateString(isRU()?'ru-RU':'en-US',{month:'short',day:'numeric'})}
function chatRow(c){const n=data.notes.find(n=>!n.trashed&&n.source?.chatId===c.id);return `<div class="row"><span class="rowicon">${icon('chat')}</span><button class="task-title" data-act="chat" data-id="${E(c.id)}"><span class="title" data-no-i18n>${E(c.title==='New conversation'?T('New conversation'):c.title)}</span><span class="desc" data-no-i18n>${E(n?T('Note: ')+(n.title||'Untitled note'):c.messages.at(-1)?.text?.slice(0,75)||T('Start a conversation'))}</span></button>${route.name==='history'?ib('more','chatmenu','Conversation options',`data-id="${E(c.id)}"`):'<span class="small-icon">'+icon('chevron')+'</span>'}</div>`}
function home(){return page('Notepad AI',`<button class="ai-entry" data-act="root" data-route="ai">${icon('ai')}<span class="grow">Ask AI Assistant…</span>${icon('chat')}</button>${section('Today','<span class="section-actions"><button class="textbtn" data-act="goto" data-route="tasks">View tasks</button><button class="textbtn" data-act="newtask">+ Task</button></span>',data.tasks.filter(t=>!t.trashed&&t.date===today&&!t.done).slice(0,2).map(taskRow).join('')||'<p class="muted mini">Nothing scheduled. A little room to think.</p>')}${section('Recent Notes','<button class="textbtn" data-act="root" data-route="notes">View all</button>',activeNotes().slice(0,3).map(noteRow).join('')||empty('Your first note','Tap + to write something down.'))}${section('Recent AI Conversations','<button class="textbtn" data-act="goto" data-route="history">View all</button>',data.chats.slice(0,2).map(chatRow).join('')||'<p class="muted mini">Your conversations will appear here.</p>')}`,ib('search','search','Search everything'),'home',`<button class="fab" data-act="newnote" aria-label="Quick note">${icon('plus')}</button>`)}
function notes(){
 let ns=notesForList().filter(n=>noteFilter==='All'||noteFilter==='Pinned'&&n.pinned||n.category===noteFilter),view=data.prefs.notesView;
 const sortNames={updated:'Last edited',updated_asc:'Last edited (oldest)',created:'Date created',created_asc:'Date created (oldest)',title:'Title A–Z',title_desc:'Title Z–A',reminder:'Reminders first'};
 const sortName=sortNames[data.prefs.notesSort]||'Last edited',viewName={compact:'Compact',comfortable:'Comfortable',tiles:'Tiles'}[view];
 const tools=selectMode?`<div class="selection-header"><button class="iconbtn" data-act="selectcancel" aria-label="${E(T('Cancel selection'))}">${icon('close')}</button><strong>${E(T('Selected: '))}${selection.size}</strong><button class="textbtn" data-act="selectall">${T('Select all')}</button></div>`:`<div class="note-list-tools"><button class="note-tool" data-act="notesview" aria-label="${E(T('Choose view'))}">${icon(view==='tiles'?'grid':'list')} ${T('View: '+viewName)} ${icon('chevron')}</button><button class="note-tool" data-act="notessort" aria-label="${E(T('Sort notes'))}">${icon('sort')} ${T(sortName)} ${icon('chevron')}</button></div>`;
 const foot=selectMode?`<div class="bulkbar" aria-label="${E(T('Select note actions'))}">${[['pin','batchpin','Pin selected'],['tag','batchcategory','Category selected'],['archive','batcharchive','Archive selected'],['more','batchmore','Actions']].map(([k,act,t])=>`<button data-act="${act}" aria-label="${E(T(t))}">${icon(k)}<span>${T(t)}</span></button>`).join('')}</div>`:`<button class="fab" data-act="newnote" aria-label="${E(T('New note'))}" title="${E(T('One tap creates a note. Long press for more.'))}">${icon('plus')}</button>`;
 return page('Notes',`<button class="searchbox full" data-act="search" data-filter="Notes">${icon('search')}<span class="muted">${T('Search notes')}</span></button>${tools}<div class="chips">${['All','Pinned',...data.categories].map(f=>`<button class="chip ${noteFilter===f?'sel':''}" data-act="notefilter" data-value="${E(f)}">${E(T(f))}</button>`).join('')}</div><div class="notes-${view}">${ns.map(n=>noteRow(n)).join('')||empty('No notes here','Start a note or choose another category.')}</div>`,ib('more',selection.size?'selectcancel':'notesoptions',selection.size?'Cancel selection':'Notes options'),'notes',foot);
}
function bodyPreview(n){return n.body.split('\n').map((line,i)=>{const m=line.match(/^\[([ xX])\]\s?(.*)/);if(!m)return `<p data-act="editbody">${highlightText(line,route.match)||'&nbsp;'}</p>`;const done=m[1]!==' ';if(done&&!data.prefs.showCompleted)return '';return `<div class="checkline ${done?'complete':''}"><button class="check square ${done?'checked':''}" data-act="toggleline" data-id="${E(n.id)}" data-index="${i}" aria-label="${done?'Reopen':'Complete'} checklist item">${done?icon('check'):''}</button><span style="${done?'text-decoration:line-through;color:var(--muted)':''}" data-act="editbody">${highlightText(m[2],route.match)}</span></div>`}).join('')}
function editor(){const n=note(route.id);if(!n||n.trashed)return page('Note unavailable',empty('This note is unavailable','Check Trash to restore it.'));const source=n.source&&chat(n.source.chatId);return header('',`<span id="savestatus" class="status ${storageError?'bad':''}">${storageError?'Not saved':'Saved on this device'}</span>${ib('pin','pinnote',n.pinned?'Unpin note':'Pin note',`data-id="${E(n.id)}"`)}${ib('more','notemenu','Note actions',`data-id="${E(n.id)}"`)}`,true)+`<div class="content"><input class="editor-title" id="noteTitle" placeholder="Title" value="${E(n.title)}" aria-label="Note title"><button class="badge editor-cat" data-act="category" data-id="${E(n.id)}">${catDot(n.category)}${E(n.category||'Add category')}</button>${n.reminder?` <button class="badge" data-act="reminder" data-id="${E(n.id)}">${icon('bell')}${E(dateLabel(n.reminder.date))} ${E(n.reminder.time)}</button>`:''}${/^(\[[ xX]\])/m.test(n.body)?`<div class="checklist-actions"><button data-act="togglecompleted" aria-pressed="${!data.prefs.showCompleted}">${data.prefs.showCompleted?'Hide completed':'Show completed'}</button><button data-act="organizecheck" data-id="${E(n.id)}">Reorder checklist</button></div>`:''}<div class="read-body" id="readBody" ${editing?'hidden':''}>${n.body?bodyPreview(n):'<p class="muted" data-act="editbody">'+T('Start writing…')+'</p>'}</div><textarea id="noteBody" class="note-body" aria-label="Note text" placeholder="Start writing…" ${editing?'':'hidden'}>${E(n.body)}</textarea>${n.source?`<div class="source">${icon('chat')}<span class="grow">${source?'From chat · '+E(source.title):'Source conversation unavailable'}</span>${source?'<button class="textbtn" data-act="source" data-id="'+E(n.id)+'">View source</button>':''}</div>`:''}<div id="savewarning">${storageError?saveWarning():''}</div><div class="editor-bottom stack">${btn(icon('chat')+(source?'Continue conversation':'Chat about this note'),'continue','primary full',`data-id="${E(n.id)}"`)}${btn(icon('ai')+'AI for this note','noteai','secondary full',`data-id="${E(n.id)}"`)}</div></div><div class="toolbar">${[['checklist','Checklist'],['list','List'],['undo','Undo'],['redo','Redo'],['ai','AI']].map(([k,t])=>`<button data-act="${k==='ai'?'noteai':'edittool'}" data-tool="${k}" data-id="${E(n.id)}">${icon(k)}${t}</button>`).join('')}</div>`}
function saveWarning(){return `<div class="notice error"><strong>Couldn’t save this note</strong><br>${E(storageError)}<div class="two">${btn('Retry','retrysave','secondary')}${btn('Copy text','copycurrent','secondary')}</div></div>`}
function tasks(){const ts=data.tasks.filter(t=>!t.trashed&&(taskFilter==='Completed'?t.done:taskFilter==='Today'?t.date===today&&!t.done:taskFilter==='Upcoming'?t.date>today&&!t.done:!t.done));return page('Tasks',`<div class="chips">${['Open','Today','Upcoming','Completed'].map(f=>`<button class="chip ${f===taskFilter?'sel':''}" data-act="taskfilter" data-value="${f}">${f}</button>`).join('')}</div>${ts.map(taskRow).join('')||empty('All clear','Tasks you create will appear here.','checklist',btn('New task','newtask','primary'))}`,ib('plus','newtask','New task'))}
function taskForm(){const t=task(route.id)||{title:'',date:calendarDay,time:'',noteId:'',reminder:'At time',repeat:'Never'};return page(route.id?'Task details':'New task',`<div class="field"><label for="taskTitle">Task title</label><input id="taskTitle" class="input" placeholder="What needs to be done?" value="${E(t.title)}" maxlength="300"></div><div class="field"><label for="taskDate">Date</label><input type="date" class="input" id="taskDate" value="${E(t.date||today)}"></div><div class="field"><label for="taskTime">Time <span class="muted">· optional</span></label><input type="time" class="input" id="taskTime" value="${E(t.time||'')}"></div><div class="field"><label for="taskReminder">Reminder</label><select id="taskReminder" class="input">${['At time','10 minutes before','1 hour before','None'].map(v=>`<option ${v===t.reminder?'selected':''}>${v}</option>`).join('')}</select></div><details><summary class="textbtn">More options</summary><div class="field"><label for="taskRepeat">Repeat</label><select id="taskRepeat" class="input">${['Never','Daily','Weekly','Monthly'].map(v=>`<option ${v===t.repeat?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label for="taskNote">Linked note</label><select id="taskNote" class="input"><option value="">None</option>${activeNotes().map(n=>`<option value="${E(n.id)}" ${t.noteId===n.id?'selected':''}>${E(n.title||'Untitled note')}</option>`).join('')}</select></div></details><div class="notice">Reminder timing is a visual demo here. This HTML does not schedule system notifications.</div>${route.id?btn(t.done?'Mark as open':'Mark complete','completetask','secondary full',`data-id="${E(t.id)}"`):''}`,route.id?ib('trash','deletetask','Delete task',`data-id="${E(t.id)}"`):'','',`<div class="footactions">${btn(route.id?'Update task':'Create task','savetask','primary full')}</div>`)}
function calendar(){const [y,m]=calendarMonth.split('-').map(Number),first=new Date(y,m-1,1),days=new Date(y,m,0).getDate(),start=(first.getDay()+6)%7;let grid=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>'<span class="dayname">'+d+'</span>').join('')+'<span></span>'.repeat(start);for(let i=1;i<=days;i++){const d=calendarMonth+'-'+String(i).padStart(2,'0');grid+=`<button class="day ${d===today?'today':''} ${d===calendarDay?'sel':''} ${data.tasks.some(t=>!t.trashed&&t.date===d&&!t.done)||activeNotes().some(n=>n.reminder?.date===d||n.day===d)?'has':''}" data-act="day" data-date="${d}">${i}</button>`}return page('Calendar',`<div class="calendarhead"><h2>${first.toLocaleDateString(isRU()?'ru-RU':'en-US',{month:'long',year:'numeric'})}</h2>${ib('back','monthprev','Previous month')}${ib('chevron','monthnext','Next month')}</div><div class="calendargrid">${grid}</div><div class="sep"></div><div class="sectionhead"><h2>${E(dateLabel(calendarDay))}</h2><button class="textbtn" data-act="goto" data-route="tasks">View tasks</button></div>${data.tasks.filter(t=>!t.trashed&&t.date===calendarDay).map(taskRow).join('')}${activeNotes().filter(n=>n.reminder?.date===calendarDay||n.day===calendarDay).map(noteRow).join('')}${!data.tasks.some(t=>!t.trashed&&t.date===calendarDay)&&!activeNotes().some(n=>n.reminder?.date===calendarDay||n.day===calendarDay)?empty('Room for something new','Add a task for this day.','calendar',btn('Create note for this date','newnoteforday','secondary')):''}`,'','calendar',`<button class="fab" data-act="newtask" aria-label="New task">${icon('plus')}</button>`)}
function more(){return page('More',[['archive','Archive','Notes you’ve put aside','archive'],['trash','Trash','Restore or permanently delete','trash'],['settings','Settings','Make it feel like yours','settings'],['user','Account',data.account?'Demo account':'Optional sign-in','account'],['card','Subscription','Free · explore AI plans','subscription'],['help','Help & About','A little guidance','help']].map(([k,t,d,r])=>row(k,t,d,'goto',`data-route="${r}"`)).join(''),'','more')}
function searchResults(){const q=searchQuery.trim();if(!q)return empty('Find your way back','Search a word from a note, conversation or task.','search');const lower=q.toLocaleLowerCase();let result='';if(['All','Notes'].includes(searchFilter))for(const n of activeNotes().filter(n=>(n.title+' '+n.body).toLocaleLowerCase().includes(lower)))result+=`<div class="resulttype">Note</div>${noteRow(n,q)}`;if(['All','Chats'].includes(searchFilter))for(const c of data.chats){const msg=c.messages.find(m=>m.text.toLocaleLowerCase().includes(lower)),matches=c.title.toLocaleLowerCase().includes(lower);if(matches||msg){const snippet=snippetNear(msg?.text||'Open conversation',q);result+=`<div class="resulttype">Chat</div><button class="row" data-act="chat" data-id="${E(c.id)}" data-message="${E(msg?.id||'')}"><span class="rowicon">${icon('chat')}</span><span class="grow"><span class="title" data-no-i18n>${highlightText(c.title,q)}</span><span class="desc" data-no-i18n>${highlightText(snippet,q)}</span></span></button>`;}}if(['All','Tasks'].includes(searchFilter))for(const t of data.tasks.filter(t=>!t.trashed&&t.title.toLocaleLowerCase().includes(lower)))result+=`<div class="resulttype">Task</div><button class="row" data-act="task" data-id="${E(t.id)}"><span class="rowicon">${icon('checklist')}</span><span class="grow"><span class="title" data-no-i18n>${highlightText(t.title,q)}</span><span class="desc">${E(dateLabel(t.date))}</span></span></button>`;return result||empty('No results','Try another word or a different filter.','search')}
function searchPage(){return page('Search',`<div class="searchbox">${icon('search')}<input id="searchInput" placeholder="Search notes, chats, tasks" value="${E(searchQuery)}" aria-label="Search notes, chats and tasks"></div><div class="chips">${['All','Notes','Chats','Tasks'].map(f=>`<button class="chip ${f===searchFilter?'sel':''}" data-act="searchfilter" data-value="${f}">${f}</button>`).join('')}</div><div id="searchResults">${searchResults()}</div>`)}
function historyPage(){return page('Conversations',`<div class="searchbox">${icon('search')}<input id="historySearch" placeholder="Search conversations" aria-label="Search conversations"></div><div id="historyResults">${data.chats.map(chatRow).join('')||empty('No conversations yet','Start with a question.','chat')}</div>`,ib('newchat','newchat','New chat'))}
function currentChat(){let c=chat(data.activeChat);if(!c){c={id:uid('c'),title:'New conversation',messages:[],draft:''};data.chats.unshift(c);data.activeChat=c.id;persist()}return c}
function aiPage(){const c=currentChat(),n=note(c.context);return header('AI Assistant',ib('history','goto','Conversations','data-route="history"')+ib('newchat','newchat','New chat'))+(n&&!n.trashed?`<div class="contextstrip">${icon('note')}<button class="grow" style="text-align:left" data-act="note" data-id="${E(n.id)}">Using note: ${E(n.title||'Untitled note')}</button>${ib('close','clearcontext','Remove note from context')}</div>`:'')+(flags.offline?'<div class="notice" style="margin:0 18px 8px">You’re offline. Saved notes and chats remain available.</div>':'')+`<div class="content chatcontent" id="messages">${c.messages.length?c.messages.map(messageHTML).join(''):empty('Where shall we start?','Ask a question or choose a note to talk about.','ai')+`<div class="suggestions"><button data-act="prompt" data-text="Give me a plan for a calm weekend.">Plan a calm weekend</button><button data-act="selectcontext">${icon('note')} Talk about a note</button><button data-act="prompt" data-text="Help me organize my thoughts.">Organize my thoughts</button></div>`}${typing?'<div class="message muted">Preparing a demo response…</div>':''}</div>${flags.quota?'<div class="notice" style="margin:0 18px 7px;padding:10px 13px"><strong>AI limit reached.</strong><br>Saved text, notes and tasks remain available. <button class="textbtn" data-act="goto" data-route="paywall">View Pro plans</button></div>':''}<div class="composerwrap"><div class="composer">${ib('note','selectcontext','Choose existing note')}<textarea id="chatDraft" rows="1" aria-label="Message AI Assistant" placeholder="Message AI Assistant…">${E(c.draft||'')}</textarea>${ib('mic','voice','Voice input demo')}${ib('send','send','Send message',flags.offline||flags.quota||typing?'disabled':'')}</div><div class="composerhint">${flags.offline?'Send when connected. Your draft is kept.':flags.quota?'Your draft is kept.':'Simulated AI · no messages sent to a server'}</div></div>${bottom('ai')}`}
function messageHTML(m){const saved=note(m.savedNote);return `<article class="message ${m.role}" id="msg-${E(m.id)}">${m.role==='assistant'?`<div class="by">${icon('ai')}AI Assistant</div>`:''}<div class="msgtext">${E(m.text)}</div>${m.role==='assistant'?`${(m.refs||[]).map(id=>note(id)&&!note(id).trashed?row('note',note(id).title,'Open source note','note',`data-id="${E(id)}"`):'').join('')}${m.proposal?proposalHTML(m):''}<button class="save-answer" data-act="saveanswer" data-message="${E(m.id)}">${icon('note')}Save to note</button>${saved&&!saved.trashed?`<div class="receipt">${icon('check')}<span class="grow">Saved · ${E(saved.title||'Untitled note')}</span><button class="textbtn" data-act="note" data-id="${E(saved.id)}">${isRU()?'Открыть':'Open'}</button></div>`:''}`:''}</article>`}

const BACKUP_FORMAT='georgina-notepad-concept02';

function record(value){return value!==null&&typeof value==='object'&&!Array.isArray(value)}
function parsePrototypeBackup(raw){
 if(typeof raw!=='string'||raw.length>6000000)throw Error('Backup is too large');
 const b=JSON.parse(raw);if(!record(b))throw Error('Unknown backup');
 const modern=b.format===BACKUP_FORMAT&&b.backupVersion===3;
 const legacy=!modern&&!Object.prototype.hasOwnProperty.call(b,'format')&&Array.isArray(b.notes)&&(b.version===2||b.version==null)&&b.tasks==null&&b.chats==null;
 if(!modern&&!legacy)throw Error('Unsupported backup format');
 const notes=b.notes,tasks=modern?b.tasks:[],chats=modern?b.chats:[];
 if(!Array.isArray(notes)||!Array.isArray(tasks)||!Array.isArray(chats)||notes.length>2000||tasks.length>3000||chats.length>500)throw Error('Invalid backup collections');
 const validId=x=>typeof x==='string'&&x.length>0&&x.length<=160;
 const ids=(items)=>{const seen=new Set();return items.every(x=>!x.id||validId(x.id)&&!seen.has(x.id)&&!!seen.add(x.id))};
 if(!notes.every(n=>record(n)&&typeof n.title==='string'&&n.title.length<=250&&typeof n.body==='string'&&n.body.length<=1000000&&(!n.category||typeof n.category==='string'&&n.category.length<=80))||!ids(notes))throw Error('Invalid notes');
 if(!tasks.every(t=>record(t)&&typeof t.title==='string'&&t.title.length<=350&&(!t.date||validISODate(t.date))&&validLocalTime(t.time)&&(!t.noteId||validId(t.noteId)))||!ids(tasks))throw Error('Invalid tasks');
 let messages=0;
 if(!chats.every(c=>record(c)&&typeof c.title==='string'&&c.title.length<=200&&Array.isArray(c.messages)&&c.messages.every(m=>{messages++;return record(m)&&typeof m.text==='string'&&m.text.length<=1000000&&['assistant','user'].includes(m.role)&&(!m.id||validId(m.id))})&&(!c.context||validId(c.context)))||messages>10000||!ids(chats))throw Error('Invalid conversations');
 return {notes,tasks,chats,categories:Array.isArray(b.categories)?b.categories.filter(x=>typeof x==='string'&&x.length<=80).slice(0,200):[],legacy};
}

document.addEventListener('focusout',()=>{setTimeout(()=>{if(route.name==='editor'&&!sheet&&!['noteTitle','noteBody'].includes(document.activeElement?.id)&&!document.activeElement?.closest('.toolbar')){editing=false;$('#app').classList.remove('editing');const n=note(route.id);if($('#readBody')&&n){$('#readBody').innerHTML=bodyPreview(n)||'<p class="muted" data-act="editbody">'+T('Start writing…')+'</p>';$('#readBody').hidden=false;$('#noteBody').hidden=true}}},80)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(sheet)closeSheet();else if(selectMode)clearSelection();else if(editing){document.activeElement?.blur();editing=false;render()}return}if(e.key==='Enter'&&e.target.id==='chatDraft'&&!e.shiftKey){e.preventDefault();send()}if(e.key==='Tab'&&sheet){const els=[...$('#overlay').querySelectorAll('button:not(:disabled),input,select,textarea')];if(els.length){if(e.shiftKey&&document.activeElement===els[0]){e.preventDefault();els.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===els.at(-1)){e.preventDefault();els[0].focus()}}}});
window.addEventListener('popstate',e=>{if(selectMode){clearSelection();return;}if(e.state?.notepad){if(route.name==='editor')saveEditorCursor();closeSheet();editing=false;route=e.state.route;if(route.name==='editor'&&note(route.id)){data.prefs.editorResume={id:route.id,start:0,end:0,scroll:route.scroll||0};}else data.prefs.editorResume=null;persist();render()}});
document.addEventListener('selectionchange',()=>{const el=document.activeElement;if(route.name==='editor'&&(el?.id==='noteBody'||el?.id==='noteTitle')){saveEditorCursor();}});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&route.name==='editor'){saveEditorCursor();persist();}});
window.addEventListener('pagehide',()=>{if(route.name==='editor')saveEditorCursor();persist()});
window.addEventListener('beforeunload',()=>{if(route.name==='editor')saveEditorCursor();persist()});
try{history.replaceState({notepad:true,route},'')}catch{}
render();
if(storageError)toast(storageError);

window.NotepadDemo={openFromNative,version:'0.6.0',validISODate,validLocalTime,makeBackup,parsePrototypeBackup,restoreBackupCopies,get state(){return data},get route(){return route},get flags(){return flags},get sheet(){return sheet},actions,nav,render,applyTool,proposal,demoResponse,labGroups,localDate,persist,seed,T,L};
