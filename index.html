/* Concept 02 v0.5.0 — lightweight mobile notes UX */
.note-list-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0 6px}
.note-tool{display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:7px 11px;background:var(--soft);border:1px solid var(--line);border-radius:11px;font-size:12px;color:var(--text)}
.note-tool[aria-pressed="true"]{background:var(--tint);color:var(--accent);border-color:var(--accent)}
.note-list-tools .note-tool svg{width:15px;height:15px}
.note-row{display:flex;align-items:center;gap:11px;min-height:72px;text-align:left;width:100%;padding:10px 0;border-bottom:1px solid var(--line)}
.note-row .rowicon{width:24px;flex:none;justify-content:center}
.note-row .rowicon svg{width:19px;height:19px}
.note-row-main{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px}
.note-row-title{font-size:15px;font-weight:600;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
.note-row-title .cat-dot{margin-right:7px;transform:translateY(-1px)}
.note-row-preview{font-size:12px;color:var(--muted);white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
.note-row-meta{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:8px;white-space:nowrap;min-width:0}
.note-row-meta .tagname{min-width:0;overflow:hidden;text-overflow:ellipsis}
.note-row .small-icon{flex:none;color:var(--muted)}
.notes-compact .note-row{min-height:52px;padding:6px 0;gap:8px}
.notes-compact .note-row-title{font-size:14px}
.notes-compact .note-row-preview{font-size:11px}
.notes-compact .note-row-meta{display:none}
.notes-compact .rowicon{width:19px}
.cat-dot{display:inline-block;vertical-align:middle;flex:none;width:8px;height:8px;border-radius:50%;background:var(--cat-0)}
.cat-0{--cat-0:#5b9f81}.cat-1{--cat-0:#868bd0}.cat-2{--cat-0:#cb9852}.cat-3{--cat-0:#b47b96}.cat-4{--cat-0:#549eae}.cat-5{--cat-0:#96974d}.cat-6{--cat-0:#9a85b4}
.editor-cat{display:inline-flex;align-items:center;gap:7px}
.notes-compact .note-row-preview{max-height:18px}
.checklist-actions{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin:14px 0 2px}
.checklist-actions button{min-height:44px;font-size:12px;padding:7px 12px;border:1px solid var(--line);border-radius:10px;color:var(--accent);background:var(--soft)}
.checkline button.check{min-width:40px;min-height:40px;margin-top:0;display:flex;align-items:center;justify-content:center;flex:none}
.checkline span{min-width:0;flex:1;overflow-wrap:anywhere}
.checkline.complete{opacity:.78}
.checklist-reorder{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.checklist-reorder .grow{font-size:13px;overflow-wrap:anywhere}
.checklist-reorder button{min-height:44px;min-width:44px;display:inline-flex;justify-content:center;align-items:center;border-radius:10px;background:var(--soft);color:var(--text)}
.checklist-reorder button:disabled{opacity:.25}
mark.note-hit{background:#f1d692;color:#352c16;border-radius:2px;padding:0 1px}
[data-theme=dark] mark.note-hit{background:#74642a;color:#fff2ba}
.section-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.section-actions button{min-height:42px}
.content{scroll-padding-bottom:105px;min-height:0}
.editor-title,.note-body{scroll-margin-bottom:155px}
input,textarea{touch-action:manipulation}
@media(max-width:350px){.content{padding-left:16px;padding-right:16px}.note-list-tools{gap:5px}.note-tool{padding:7px 8px}.sectionhead h2{font-size:15px}.section-actions{gap:4px}.section-actions button{font-size:11px}.editor-title{font-size:25px}}
@supports(height:100dvh){.device,.phone,.mockphone{max-height:100dvh}}

/* v0.6 management: independent, keyboard-accessible menu and calm tile/list views */
.note-card{position:relative;display:flex;align-items:stretch;min-width:0;gap:0;border-bottom:1px solid var(--line);border-radius:9px;transition:background .12s}
.note-card:last-child{border-bottom:0}.note-card:hover{background:var(--soft)}
.note-card.is-selected{background:var(--tint);outline:2px solid var(--accent);outline-offset:-2px}
.note-accent{width:4px;flex:none;border-radius:7px;background:var(--note-color);margin:11px 7px 11px 0}.note-accent.neutral{opacity:.65}
.note-open{min-width:0;flex:1;border:0;padding:12px 0!important;min-height:63px;overflow:hidden}
.note-open .rowicon{flex:none}.note-open .note-row-main{min-width:0;flex:1}
.note-open .note-row-title,.note-open .note-row-preview,.note-open .note-row-meta{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note-open .note-row-title{font-size:15px;font-weight:650}
.note-open .note-row-preview{font-size:13px;color:var(--muted);margin-top:3px}

function T(text){if(!isRU())return String(text??'');const s=String(text??'');if(Object.prototype.hasOwnProperty.call(RU,s))return RU[s];return s.replace(/^(Today|Tomorrow)(, .*)$/,(_,a,b)=>RU[a]+b).replace(/^Local time · /,'Местное время · ').replace(/ · whole note$/,' · вся заметка').replace(/^(Saved · )/,'Сохранено · ').replace(/^From chat · /,'Из чата · ').replace(/^Using note: /,'Контекст: ').replace(/^Note: /,'Заметка: ').replace(/^(\d+) text notes$/,'Текстовых заметок: $1').replace(/^Archive (\d+) notes$/,'Архивировать заметки: $1').replace(/ · local time$/,' · местное время').replace(/local browser prototype/g,'локальный браузерный прототип');}
function decodeUI(s){return s.replace(/&amp;/g,'&').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&lt;/g,'<').replace(/&gt;/g,'>')}
function L(markup){if(!isRU())return markup;const stack=[];let out='';markup=markup.replace(/<option([^>]*)>([^<]*)<\/option>/g,(all,attrs,text)=>/\bvalue=/.test(attrs)?all:'<option'+attrs+' value="'+E(decodeUI(text))+'">'+text+'</option>');for(const part of markup.split(/(<[^>]*>)/g)){if(part.startsWith('<')){if(/^<\//.test(part)){stack.pop();out+=part;continue}const tag=part.match(/^<([\w-]+)/)?.[1]?.toLowerCase();const skip=stack.at(-1)||tag==='textarea'||/data-no-i18n/.test(part)||/class="[^"]*\b(?:read-body|msgtext|previewtext)\b/.test(part);let translated=part.replace(/(\s(?:aria-label|placeholder|title)=")([^"]*)"/g,(_,a,b)=>a+E(T(decodeUI(b)))+'"');out+=translated;if(tag&&!/\/\s*>$/.test(part)&&!['input','br','hr','img','meta','link','area','source'].includes(tag))stack.push(skip)}else{if(stack.at(-1)){out+=part;continue}const trimmed=decodeUI(part.trim()),translated=T(trimmed);if(translated!==trimmed)out+=part.replace(part.trim(),E(translated));else out+=part.split('\n').map(x=>{const t=decodeUI(x.trim());return x.replace(x.trim(),E(T(t)))}).join('\n')}}return out}

function validISODate(value){if(typeof value!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(value))return false;const [y,m,d]=value.split('-').map(Number);if(y<1||m<1||m>12||d<1||d>31)return false;const actual=new Date(0);actual.setUTCHours(0,0,0,0);actual.setUTCFullYear(y,m-1,d);return actual.getUTCFullYear()===y&&actual.getUTCMonth()===m-1&&actual.getUTCDate()===d}

function calendar(){
 const firstDay=data.prefs.weekStart==='sunday'?0:1;
 const selected=validISODate(calendarDay)?calendarDay:localDate();
 const [year,month]=calendarMonth.split('-').map(Number);
 const first=new Date(year,month-1,1),days=new Date(year,month,0).getDate();
 const taskDays=new Set(data.tasks.filter(t=>!t.trashed&&validISODate(t.date)).map(t=>t.date));
 const noteDays=new Set();for(const n of data.notes){if(n.archived||n.trashed)continue;if(validISODate(n.day))noteDays.add(n.day);if(validISODate(n.reminder?.date))noteDays.add(n.reminder.date)}
 const titles=firstDay===1?['Mon','Tue','Wed','Thu','Fri','Sat','Sun']:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
 let cells=[];
 if(data.prefs.calendarView==='week'){
   const [y,m,d]=selected.split('-').map(Number),start=new Date(y,m-1,d),weekday=(start.getDay()-firstDay+7)%7;start.setDate(start.getDate()-weekday);
   cells=Array.from({length:7},(_,i)=>{const date=new Date(start.getTime());date.setDate(start.getDate()+i);return localDate(date)});
 }else{
   const offset=(first.getDay()-firstDay+7)%7;
   cells=[...Array(offset).fill(''),...Array.from({length:days},(_,i)=>calendarMonth+'-'+String(i+1).padStart(2,'0'))];
 }
 let grid=titles.map(d=>`<span class="dayname">${T(d)}</span>`).join('');
 for(const d of cells){if(!d){grid+='<span aria-hidden="true"></span>';continue;}
  const marks=(noteDays.has(d)?'<i class="day-mark"></i>':'')+(taskDays.has(d)?'<i class="day-mark task"></i>':'');
  const label=E(formatUserDate(d))+' · '+(noteDays.has(d)?T('Notes')+' ':'')+(taskDays.has(d)?T('Tasks'):'');
  grid+=`<button class="day ${d===localDate()?'today':''} ${d===selected?'sel':''}" data-act="day" data-date="${d}" aria-label="${E(label)}" aria-pressed="${d===selected}">${Number(d.slice(-2))}${marks}</button>`;
 }
 const notesOnDay=activeNotes().filter(n=>n.day===selected||n.reminder?.date===selected);
 const tasksOnDay=data.tasks.filter(t=>!t.trashed&&t.date===selected);
 const viewTabs=`<div class="calendar-mode"><button class="${data.prefs.calendarView==='month'?'sel':''}" data-act="calview" data-value="month">${T('Month')}</button><button class="${data.prefs.calendarView==='week'?'sel':''}" data-act="calview" data-value="week">${T('Week')}</button><button data-act="calendartoday">${T('Today')}</button><button style="margin-left:auto" data-act="goto" data-route="calprefs" aria-label="${E(T('Open calendar settings'))}">${icon('settings')}</button></div>`;
 const headerTitle=data.prefs.calendarView==='month'?first.toLocaleDateString(isRU()?'ru-RU':'en-US',{month:'long',year:'numeric'}):formatUserDate(cells[0])+' – '+formatUserDate(cells.at(-1));
 const details=`<div class="cal-details"><div class="sectionhead"><h2>${E(formatUserDate(selected))}</h2></div><h3>${T('Notes for this day')} · ${notesOnDay.length}</h3>${notesOnDay.map(n=>noteRow(n)).join('')||`<p class="meta">${T('No notes linked to this day')}</p>`}<h3>${T('Tasks for this day')} · ${tasksOnDay.length}</h3>${tasksOnDay.map(taskRow).join('')||`<p class="meta">${T('No tasks for this day')}</p>`}</div><div class="cal-actions">${btn(T('Create note for this date'),'newnoteforday','secondary')}${btn(T('Create task for this date'),'newtaskforday','secondary')}</div><p class="meta">${T('Calendar note date is not a reminder.')}</p>`;
 return page('Calendar',`${viewTabs}<div class="calendarhead"><h2>${E(headerTitle)}</h2>${ib('back','monthprev',data.prefs.calendarView==='month'?'Previous month':'Previous week')}${ib('chevron','monthnext',data.prefs.calendarView==='month'?'Next month':'Next week')}</div><div class="calendargrid">${grid}</div><div class="calendar-legend"><span><i class="cal-dot"></i>${T('Notes')}</span><span><i class="cal-dot task"></i>${T('Tasks')}</span></div><div class="sep"></div>${details}`,'','calendar',`<button class="fab" data-act="newtaskforday" aria-label="${E(T('Create task for this date'))}">${icon('plus')}</button>`);
}

function searchResults(){
 const q=searchQuery.trim();
 if(!q)return empty('Find your way back','Search a word from a note, conversation or task.','search');
 const lower=q.toLocaleLowerCase();let count=0,out='';
 const push=make=>{count++;if(count<=searchResultLimit)out+=make()};
 if(['All','Notes'].includes(searchFilter))for(const n of activeNotes()){
  if((n.title+' '+n.body).toLocaleLowerCase().includes(lower))push(()=>'<div class="resulttype">Note</div>'+noteRow(n,q));
 }
 if(['All','Chats'].includes(searchFilter))for(const c of data.chats){
  const msg=c.messages.find(m=>m.text.toLocaleLowerCase().includes(lower));
  if(c.title.toLocaleLowerCase().includes(lower)||msg)push(()=>{
   const sn=snippetNear(msg?.text||'Open conversation',q);
   return '<div class="resulttype">Chat</div><button class="row" data-act="chat" data-id="'+E(c.id)+'" data-message="'+E(msg?.id||'')+'"><span class="rowicon">'+icon('chat')+'</span><span class="grow"><span class="title" data-no-i18n>'+highlightText(c.title,q)+'</span><span class="desc" data-no-i18n>'+highlightText(sn,q)+'</span></span></button>';
  });
 }
 if(['All','Tasks'].includes(searchFilter))for(const t of data.tasks){
  if(!t.trashed&&t.title.toLocaleLowerCase().includes(lower))push(()=>'<div class="resulttype">Task</div><button class="row" data-act="task" data-id="'+E(t.id)+'"><span class="rowicon">'+icon('checklist')+'</span><span class="grow"><span class="title" data-no-i18n>'+highlightText(t.title,q)+'</span><span class="desc">'+E(dateLabel(t.date))+'</span></span></button>');
 }
 if(!count)return empty('No results','Try another word or a different filter.','search');
 if(count>searchResultLimit){
  const label=isRU()?'Показано '+searchResultLimit+' из '+count+' результатов':'Showing '+searchResultLimit+' of '+count+' results';
  out+='<div class="loadmore"><span class="meta">'+E(label)+'</span><button class="btn secondary full" data-act="loadmoreresults">'+(isRU()?'Показать ещё':'Load more results')+'</button></div>';
 }
 return out;
}

function onboard(){const steps=[{icon:'note',title:'Your notes.\nYour conversations.',desc:'A calm place to write things down and keep what matters.',a:'Write a quick note',b:'Make a simple list',c:'Find it when you need it'},{icon:'ai',title:'A useful answer.\nA note to keep.',desc:'Talk with AI Assistant. Save a helpful answer as a separate note when you choose.',a:'Ask in your own words',b:'Review before saving',c:'Stay in the conversation'},{icon:'history',title:'Come back.\nPick up the thread.',desc:'Open a note, find its source, or continue the same conversation.',a:'Search notes and chats',b:'Plan tasks and reminders',c:'Keep your everyday work simple'}],s=steps[route.step||0];return `<div class="content" style="padding:0"><div class="onboard"><div style="display:flex;justify-content:space-between;align-items:center"><span class="eyebrow">NOTEPAD AI</span><button class="textbtn" data-act="finishonboard">Skip</button></div><div class="brandmark">${icon(s.icon)}</div><h1 class="prewrap">${s.title}</h1><p>${s.desc}</p><div style="margin:20px 0">${[s.a,s.b,s.c].map((v,i)=>`<div class="feature">${icon(['note','checklist','search'][i])}${v}</div>`).join('')}</div><div class="bottom"><div class="dots">${[0,1,2].map(i=>`<span class="${i===(route.step||0)?'active':''}"></span>`).join('')}</div>${btn(route.step===2?'Get started':'Continue','onboardnext','primary full')}<p class="meta" style="margin-top:18px">Offline text notes · AI features are a demo</p></div></div></div>`}

function archivePage(kind){const ns=data.notes.filter(n=>kind==='trash'?n.trashed:n.archived&&!n.trashed),ts=kind==='trash'?data.tasks.filter(t=>t.trashed):[];return page(kind==='trash'?'Trash':'Archive',`<p class="muted" style="font-size:13px;margin:4px 0 16px">${kind==='trash'?'Restore an item, or choose Delete permanently.':'Notes you’ve put aside. Restore them whenever you need them.'}</p>${ns.map(n=>row('note',n.title||'Untitled note',n.body.slice(0,90),'storedmenu',`data-id="${E(n.id)}"`)).join('')}${ts.map(t=>row('checklist',t.title,'Task · moved to Trash','trashtaskmenu',`data-id="${E(t.id)}"`)).join('')}${!ns.length&&!ts.length?empty(kind==='trash'?'Trash is empty':'Nothing archived',kind==='trash'?'Deleted items will appear here.':'Archived notes will appear here.',kind):''}`)}
function dataPage(){return page('Data & sync',`<p class="muted" style="font-size:14px;margin-bottom:15px">Export notes, tasks and conversations as a JSON backup.</p>${storageError?'<div class="notice error">'+E(storageError)+(corruptRaw?btn('Export unreadable data','exportcorrupt','secondary full'):'')+'</div>':''}`+row('sync','Sync',data.sync?'Demo enabled':'Off','togglesync','',`<span class="toggle ${data.sync?'on':''}"></span>`)+row('export','Export notes','Download readable text','exportall')+row('download','Create backup','Notes, tasks and chats · JSON','backup')+row('shield','Storage health','Local data and backup validity','goto','data-route="storagehealth"')+row('restore','Local recovery point',recoveryInfo().valid?'Saved on this device':'No verified local copy','goto','data-route="storagehealth"')+row('restore','Restore backup','Add notes, tasks and chats as copies','goto','data-route="restore"')+row('sync','Review a conflict','Explore two versions · demo','goto','data-route="conflict"')+`<div class="notice">Backup includes notes, tasks, conversations and links. Restoring adds copies without replacing existing data. Settings are exported for reference but not applied. This demo has no cloud sync or encryption. A local recovery point stays on this device, so also download a JSON copy.</div>`)}

// Backup format v3 is separate from the existing localStorage schema (version 2).
// JSON backup is unencrypted; demo account and billing state are not restored.
const BACKUP_FORMAT='georgina-notepad-concept02';
function makeBackup(){return {format:BACKUP_FORMAT,backupVersion:3,sourceVersion:'0.9.0',created:now(),notes:data.notes,tasks:data.tasks,chats:data.chats,categories:data.categories,settings:{language:data.language,theme:data.theme,font:data.font,prefs:data.prefs}}}
function record(value){return value!==null&&typeof value==='object'&&!Array.isArray(value)}
function parsePrototypeBackup(raw){
 if(typeof raw!=='string'||raw.length>12000000)throw Error('Backup is too large');
 const b=JSON.parse(raw);if(!record(b))throw Error('Unknown backup');
 const modern=b.format===BACKUP_FORMAT&&b.backupVersion===3;
 const legacy=!modern&&!Object.prototype.hasOwnProperty.call(b,'format')&&Array.isArray(b.notes)&&(b.version===2||b.version==null)&&b.tasks==null&&b.chats==null;
 if(!modern&&!legacy)throw Error('Unsupported backup format');
 const notes=b.notes,tasks=modern?b.tasks:[],chats=modern?b.chats:[];
 if(!Array.isArray(notes)||!Array.isArray(tasks)||!Array.isArray(chats)||notes.length>10000||tasks.length>10000||chats.length>1000)throw Error('Invalid backup collections');
 const validId=x=>typeof x==='string'&&x.length>0&&x.length<=160;
 const ids=(items)=>{const seen=new Set();return items.every(x=>!x.id||validId(x.id)&&!seen.has(x.id)&&!!seen.add(x.id))};
 if(!notes.every(n=>record(n)&&typeof n.title==='string'&&n.title.length<=250&&typeof n.body==='string'&&n.body.length<=1000000&&(!n.category||typeof n.category==='string'&&n.category.length<=80))||!ids(notes))throw Error('Invalid notes');
 if(!tasks.every(t=>record(t)&&typeof t.title==='string'&&t.title.length<=350&&(!t.date||validISODate(t.date))&&validLocalTime(t.time)&&(!t.noteId||validId(t.noteId)))||!ids(tasks))throw Error('Invalid tasks');
 let messages=0;
 if(!chats.every(c=>record(c)&&typeof c.title==='string'&&c.title.length<=200&&Array.isArray(c.messages)&&new Set(c.messages.map(m=>m?.id).filter(Boolean)).size===c.messages.filter(m=>m?.id).length&&c.messages.every(m=>{messages++;return record(m)&&typeof m.text==='string'&&m.text.length<=1000000&&['assistant','user'].includes(m.role)&&(!m.id||validId(m.id))})&&(!c.context||validId(c.context)))||messages>10000||!ids(chats))throw Error('Invalid conversations');
 return {notes,tasks,chats,categories:Array.isArray(b.categories)?b.categories.filter(x=>typeof x==='string'&&x.length<=80).slice(0,200):[],legacy};
}
// A deliberately separate optional local recovery slot. Browser data clearing removes both copies.
function recoveryInfo(){
 try{const raw=localStorage.getItem(RECOVERY_KEY);if(!raw)return {present:false,valid:false};
  const parsed=parsePrototypeBackup(raw),meta=JSON.parse(raw);
  return {present:true,valid:true,raw,backup:parsed,created:typeof meta.created==='string'?meta.created:'',notes:parsed.notes.length,tasks:parsed.tasks.length,chats:parsed.chats.length};
 }catch(e){return {present:true,valid:false,error:String(e.message||e)}}
}
function saveLocalRecovery(){
 try{if(storeBlocked)throw new Error('Original stored data is unreadable. Export it before making changes.');
  const raw=JSON.stringify(makeBackup());parsePrototypeBackup(raw);
  if(raw.length>2500000)throw new Error('This data set is too large for an extra local copy. Download a JSON backup instead.');
  localStorage.setItem(RECOVERY_KEY,raw);
  const copy=recoveryInfo();if(!copy.valid||copy.raw!==raw)throw new Error('Could not verify local recovery copy.');
  toast('Local recovery point saved on this device.');return true;
 }catch(e){toast('Recovery point not saved. Download a JSON backup.');return false}
}
function inspectRelationships(){
 const notes=new Set(data.notes.map(n=>n.id)),chats=new Set(data.chats.map(c=>c.id));
 let orphanTasks=0,orphanNotes=0,orphanChats=0;
 for(const t of data.tasks)if(t.noteId&&!notes.has(t.noteId))orphanTasks++;
 for(const n of data.notes)if(n.source?.chatId&&!chats.has(n.source.chatId))orphanNotes++;
 for(const c of data.chats)if(c.context&&!notes.has(c.context))orphanChats++;
 return {orphanTasks,orphanNotes,orphanChats};
}
function storeHealthStatus(){

 catch(e){return {valid:false,bytes:0,error:String(e.message||e),links:inspectRelationships()}}
}
function restoreBackupCopies(backup){
 const nmap=new Map(),cmap=new Map(),mmap=new Map(),newNotes=[],newTasks=[],newChats=[];
 backup.notes.forEach((n,i)=>nmap.set(n.id||'legacy_note_'+i,uid('n')));
 backup.chats.forEach((c,i)=>cmap.set(c.id||'legacy_chat_'+i,uid('c')));
 backup.chats.forEach((c,i)=>c.messages.forEach((m,j)=>mmap.set((c.id||'legacy_chat_'+i)+'|'+(m.id||'legacy_msg_'+j),uid('m'))));
 const sourceLink=s=>{if(!record(s)||!cmap.has(s.chatId))return null;const cid=cmap.get(s.chatId),mid=mmap.get(s.chatId+'|'+s.messageId);return mid?{chatId:cid,messageId:mid}:null};
 backup.notes.forEach((n,i)=>{
  const copy={...n,id:nmap.get(n.id||'legacy_note_'+i),title:n.title+' (restored)',updated:now(),rev:1};
  const first=sourceLink(n.source);if(first)copy.source=first;else delete copy.source;
  if(Array.isArray(n.sources))copy.sources=n.sources.map(sourceLink).filter(Boolean);
  if(cmap.has(n.conversationId))copy.conversationId=cmap.get(n.conversationId);else delete copy.conversationId;
  newNotes.push(copy);
 });
 backup.tasks.forEach((t,i)=>{const copy={...t,id:uid('t')};if(nmap.has(t.noteId))copy.noteId=nmap.get(t.noteId);else copy.noteId='';newTasks.push(copy)});
 backup.chats.forEach((c,i)=>{
  const oldId=c.id||'legacy_chat_'+i;
  const messages=c.messages.map((m,j)=>{
   const copy={...m,id:mmap.get(oldId+'|'+(m.id||'legacy_msg_'+j))};
   if(nmap.has(m.savedNote))copy.savedNote=nmap.get(m.savedNote);else delete copy.savedNote;
   if(Array.isArray(m.refs))copy.refs=m.refs.map(x=>nmap.get(x)).filter(Boolean);
   // A restored conversation keeps its history but never replays a pending tool mutation.
   if(record(m.proposal))copy.proposal={...m.proposal,id:uid('op'),status:'cancelled'};
   return copy;
  });
  const copy={...c,id:cmap.get(oldId),title:c.title+' (restored)',messages};
  if(nmap.has(c.context))copy.context=nmap.get(c.context);else copy.context='';
  newChats.push(copy);
 });
 return transaction(()=>{
  data.notes.push(...newNotes);data.tasks.push(...newTasks);data.chats.push(...newChats);
  for(const c of backup.categories)if(!data.categories.includes(c))data.categories.push(c);
 });

 const da=$('#reminderDate'),tm=$('#reminderTime');if(!da||!tm)return;
 let t=new Date();let date='';
 const all=$('#reminderAllDay096');if(all)all.checked=false;
 if(d.value==='today'||d.value==='tomorrow'){if(d.value==='tomorrow')t.setDate(t.getDate()+1);date=localDate(t);if(d.value==='today'&&date===localDate()&&tm.value<localTimeNow096())tm.value=localTimePlus096(60);}
 else{t=new Date(Date.now()+Number(d.value)*60000);date=localDate(t);tm.value=[t.getHours(),t.getMinutes()].map(x=>String(x).padStart(2,'0')).join(':')}
 da.value=date;
};
function localTimeNow096(){const d=new Date();return [d.getHours(),d.getMinutes()].map(x=>String(x).padStart(2,'0')).join(':')}
function localTimePlus096(minutes){const d=new Date(Date.now()+minutes*60000);return [d.getHours(),d.getMinutes()].map(x=>String(x).padStart(2,'0')).join(':')}
actions.pinshade096=d=>{
 const n=note(d.id);if(!n)return;
 if(!native096()){toast(tr('В браузере закрепление в шторке недоступно','Notification shade unavailable in browser'));return}
 const pinned=window.NotepadAndroid.isNotePinned(n.id);
 if(pinned){window.NotepadAndroid.unpinNote(n.id);toast(tr('Убрано из шторки','Unpinned from shade'));}
 else{window.NotepadAndroid.pinNote(n.id,n.title||tr('Без названия','Untitled note'),n.body.slice(0,150));toast(tr('Запрошено закрепление. Проверь разрешения уведомлений.','Requested pin; check notification permission.'));}
 const b=$('#pinshade096');if(b)b.textContent=pinned?tr('Закрепить','Pin'):tr('Убрать','Unpin');
};
const prevSave096=actions.savereminder;
actions.savereminder=d=>{
 const n=note(d.id),date=$('#reminderDate')?.value,time=$('#reminderTime')?.value;
 if(!n||!date||!time)return toast(tr('Укажи дату и время','Choose date and time'));
 const epoch=new Date(date+'T'+time+':00').getTime();
 if(!Number.isFinite(epoch)||epoch<Date.now()-5000)return toast(tr('Укажи время в будущем','Choose a future time'));
 const repeat=$('#reminderRepeat')?.value||'Never',allDay=!!$('#reminderAllDay096')?.checked;
 if(!validISODate(date)||!validLocalTime(time,true))return;
 if(!transaction(()=>{n.reminder={date,time,repeat,allDay};n.updated=now()}))return;
 closeSheet();render();
 if(native096()){try{window.NotepadAndroid.cancelReminder(n.id)}catch{}}
 if(native096()&&repeat==='Never'&&!allDay){
  try{window.NotepadAndroid.scheduleReminder(n.id,n.title||tr('Без названия','Untitled note'),n.body.slice(0,150),epoch);toast(tr('Напоминание сохранено. Проверь разрешение Android.','Reminder saved; check Android notifications permission.'))}
  catch(e){toast(tr('Сохранено локально, но Android-уведомление не настроено','Saved locally, but native notification was not scheduled'))}
 } else toast(allDay?tr('Дата сохранена: весь день, без сигнала по времени','All-day date saved without timed alert'):native096()?tr('Повтор сохранён как DEMO, без системного повтора','Repeat is DEMO only'):tr('Напоминание сохранено · DEMO','Reminder saved · DEMO'));
};
const prevRemove096=actions.removereminder;
actions.removereminder=d=>{if(native096())try{window.NotepadAndroid.cancelReminder(d.id)}catch{};prevRemove096(d)};
window.NotepadDemo.openExistingNote096=id=>{const n=note(String(id));if(n&&!n.trashed)nav('editor',{id:n.id},true);else nav('notes',{},true)};
window.NotepadDemo.version=V096;window.NotepadDemo.nativeReminders096=native096();
render();
})();
